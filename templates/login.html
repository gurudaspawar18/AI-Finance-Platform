<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Personal Finance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* Navigation */

        nav {
            background: #1f2937;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        /* Login card */

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* Form */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* Login button */

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        /* Register */

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 768px) {

            nav a {
                display: inline-block;
                margin: 6px;
            }

            .container {
                width: 94%;
            }

            .login-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="/">Home</a>

        <a href="/login">Login</a>

        <a href="/register">Register</a>

    </nav>


    <!-- Login -->

    <div class="container">


        <div class="login-card">


            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your personal finance dashboard.
            </p>


            <form method="POST">


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


            </form>


            <p class="register-text">

                Don't have an account?

                <a
                    href="/register"
                    class="register-link"
                >
                    Create Account
                </a>

            </p>


        </div>


    </div>


</body>

</html>
