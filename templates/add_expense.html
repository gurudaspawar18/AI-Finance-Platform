<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* Navigation */

        nav {
            background: #1f2937;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        /* Form card */

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .form-card h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        /* Form fields */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* AI information */

        .ai-info {
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        .ai-info h3 {
            margin-top: 0;
        }

        .ai-info p {
            margin-bottom: 0;
            color: #555;
        }

        /* Submit button */

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        /* Back button */

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 768px) {

            nav a {
                display: inline-block;
                margin: 6px;
            }

            .container {
                width: 94%;
            }

            .form-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="/">Home</a>

        <a href="/dashboard">Dashboard</a>

        <a href="/add-expense">Add Expense</a>

        <a href="/expenses">Expense History</a>

        <a href="/logout">Logout</a>

    </nav>


    <!-- Main container -->

    <div class="container">


        <div class="form-card">


            <h1>Add Expense</h1>

            <p class="description">
                Enter your expense details below.
            </p>


            <!-- AI information -->

            <div class="ai-info">

                <h3>🤖 AI Expense Categorization</h3>

                <p>
                    You don't need to select a category manually.
                    Our AI model will automatically predict the
                    appropriate category from your description.
                </p>

            </div>


            <!-- Expense form -->

            <form method="POST" action="/add-expense">


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0"
                        placeholder="Example: 500"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="Example: Burger or Uber ride"
                        required
                    >

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    Add Expense
                </button>


            </form>


            <a
                href="/dashboard"
                class="back"
            >
                ← Back to Dashboard
            </a>


        </div>


    </div>


</body>

</html>
